// Spelers die voor een ronde nog niet (volledig) hebben voorspeld —
// gebruikt door de organisator om te zien wie nog moet invullen.
function getMissingPlayers(players, round, predictions) {
  if (!round || !round.matches || round.matches.length === 0) return [];
  const roundPreds = predictions?.[round.id] || {};
  return (players || []).filter(p => !round.matches.every(m => roundPreds?.[p]?.[m.id]?.pick));
}

function computeStandings(rounds, predictions, players) {
  const totals = {};
  players.forEach(p => totals[p] = 0);
  const perRound = {};
  const perMatch = {}; // roundId -> matchId -> player -> {pick, correct, amount, joker}

  rounds.forEach(round => {
    perRound[round.id] = {};
    perMatch[round.id] = {};
    players.forEach(p => perRound[round.id][p] = 0);
    round.matches.forEach(match => {
      perMatch[round.id][match.id] = {};
      if (!match.result) return;
      players.forEach(player => {
        const pred = predictions?.[round.id]?.[player]?.[match.id];
        let amount,
          correct = null;
        if (!pred || !pred.pick) {
          amount = -0.5;
        } else {
          correct = pred.pick === match.result;
          const odds = parseOdds(match[oddsKey[pred.pick]]);
          let base = correct ? odds - 1 : -1;
          const isJoker = round.jokerActive && round.jokerMatchId === match.id && pred.joker;
          amount = isJoker ? base * 2 : base;
          perMatch[round.id][match.id][player] = {
            pick: pred.pick,
            correct,
            amount,
            joker: !!isJoker
          };
        }
        if (!perMatch[round.id][match.id][player]) {
          perMatch[round.id][match.id][player] = {
            pick: null,
            correct: null,
            amount,
            joker: false
          };
        }
        totals[player] = (totals[player] || 0) + amount;
        perRound[round.id][player] = (perRound[round.id][player] || 0) + amount;
      });
    });
  });
  return {
    totals,
    perRound,
    perMatch
  };
}

// Excel-import: leest het vaste sheet-formaat dat de groep al jaren gebruikt
// (per ronde één tabblad met wedstrijden, quoteringen 1/3/2, uitslag en
// voorspellingen per speler) en zet dit om naar het datamodel van de app.
// Kolom-codes in het Excel-bestand: 1 = thuiswinst, 3 = gelijkspel, 2 = uitwinst,
// 0 (of leeg) = geen voorspelling ingevuld.
const EXCEL_CODE_TO_OUTCOME = {
  1: "home",
  2: "away",
  3: "draw"
};
function parseExcelHistory(workbook) {
  const skipSheets = new Set(["Formule", "Totaal", "Blad1", "Blad2"]);
  const foundRounds = [];
  const allPlayersSet = new Set();
  workbook.SheetNames.forEach(sheetName => {
    if (skipSheets.has(sheetName)) return;
    const ws = workbook.Sheets[sheetName];
    if (!ws) return;
    const cell = (col, row) => {
      const ref = `${col}${row}`;
      const c = ws[ref];
      return c ? c.v : undefined;
    };
    // Een ronde-tabblad heeft in B4 de eerste thuisploeg staan; is dat leeg,
    // dan is dit een nog niet ingevulde/toekomstige ronde — die slaan we over.
    if (cell("B", 4) === undefined || cell("B", 4) === null || cell("B", 4) === "") return;

    // Spelernamen staan op rij 2, vanaf kolom K, tot de eerste lege cel.
    const players = [];
    const colLetters = "KLMNOPQRSTUVWXYZ".split("");
    for (const col of colLetters) {
      const v = cell(col, 2);
      if (v === undefined || v === null || v === "") break;
      players.push(String(v).trim());
    }
    players.forEach(p => allPlayersSet.add(p));

    // Wedstrijdrijen: vanaf rij 4, zolang kolom B (thuisploeg) gevuld is.
    const matches = [];
    let row = 4;
    while (true) {
      const home = cell("B", row);
      if (home === undefined || home === null || home === "") break;
      const away = cell("D", row);
      const qHome = cell("E", row);
      const qDraw = cell("F", row);
      const qAway = cell("G", row);
      const resultCode = cell("I", row);
      const picks = {};
      colLetters.slice(0, players.length).forEach((col, idx) => {
        const code = cell(col, row);
        picks[players[idx]] = EXCEL_CODE_TO_OUTCOME[code] || null;
      });
      matches.push({
        home: String(home).trim(),
        away: away ? String(away).trim() : "",
        qHome: qHome != null ? String(qHome) : "",
        qDraw: qDraw != null ? String(qDraw) : "",
        qAway: qAway != null ? String(qAway) : "",
        result: EXCEL_CODE_TO_OUTCOME[resultCode] || null,
        picks
      });
      row += 1;
    }
    if (matches.length === 0) return;
    foundRounds.push({
      sheetName,
      sortKey: isNaN(Number(sheetName)) ? sheetName : Number(sheetName),
      players,
      matches
    });
  });
  // Sorteer rondes op sheet-volgorde (numerieke tabbladnamen eerst op nummer).
  foundRounds.sort((a, b) => {
    if (typeof a.sortKey === "number" && typeof b.sortKey === "number") return a.sortKey - b.sortKey;
    return String(a.sortKey).localeCompare(String(b.sortKey));
  });
  return {
    rounds: foundRounds,
    allPlayers: Array.from(allPlayersSet)
  };
}

// Leuke statistieken voor de homepagina: hoogste rondescore, hoogste score deze
// maand, "koningsrondes" (alle wedstrijden goed) en totaal aantal goede voorspellingen.
function computeFunStats(rounds, players, perMatch, perRound) {
  let bestEver = null;
  let bestMonth = null;
  const kingsCount = {};
  const correctCount = {};
  const zeroCount = {}; // Glazenwisser: rondes waarin alle voorspelde wedstrijden fout waren
  const sleepCount = {}; // Slaperd: aantal wedstrijden niet voorspeld (-0.5)
  players.forEach(p => {
    kingsCount[p] = 0;
    correctCount[p] = 0;
    zeroCount[p] = 0;
    sleepCount[p] = 0;
  });
  const now = new Date();
  const curMonth = now.getMonth();
  const curYear = now.getFullYear();
  const monthlyTotals = {}; // "2026-8" -> { player: totaalbedrag }
  rounds.forEach(round => {
    const fullyResolved = round.matches.length > 0 && round.matches.every(m => m.result);

    // aantal goede voorspellingen telt per afgeronde wedstrijd, ook in een
    // ronde die nog niet helemaal compleet is
    round.matches.forEach(match => {
      if (!match.result) return;
      players.forEach(player => {
        const d = perMatch[round.id]?.[match.id]?.[player];
        if (d && d.pick && d.correct) correctCount[player] = (correctCount[player] || 0) + 1;
        if (d && !d.pick) sleepCount[player] = (sleepCount[player] || 0) + 1;
      });
    });
    if (!fullyResolved) return;
    const deadlineDate = new Date(round.deadline);
    const isThisMonth = deadlineDate.getMonth() === curMonth && deadlineDate.getFullYear() === curYear;
    const monthKey = `${deadlineDate.getFullYear()}-${deadlineDate.getMonth()}`;
    if (!monthlyTotals[monthKey]) monthlyTotals[monthKey] = {};
    players.forEach(player => {
      const amount = perRound[round.id]?.[player] ?? 0;
      monthlyTotals[monthKey][player] = (monthlyTotals[monthKey][player] || 0) + amount;
      if (!bestEver || amount > bestEver.amount) bestEver = {
        player,
        amount,
        roundName: round.name
      };
      if (isThisMonth && (!bestMonth || amount > bestMonth.amount)) {
        bestMonth = {
          player,
          amount,
          roundName: round.name
        };
      }
      const allCorrect = round.matches.every(m => {
        const d = perMatch[round.id]?.[m.id]?.[player];
        return d && d.pick && d.correct;
      });
      if (allCorrect) kingsCount[player] = (kingsCount[player] || 0) + 1;

      const allPredictedWrong = round.matches.every(m => {
        const d = perMatch[round.id]?.[m.id]?.[player];
        return d && d.pick && d.correct === false;
      });
      if (allPredictedWrong) zeroCount[player] = (zeroCount[player] || 0) + 1;
    });
  });
  const kingsRounds = Object.entries(kingsCount).filter(([, c]) => c > 0).sort((a, b) => b[1] - a[1]).map(([player, count]) => ({
    player,
    count
  }));

  // Vorm: som van de punten over de laatste 12 afgeronde wedstrijden
  // (dezelfde 12 wedstrijden voor iedereen), chronologisch op ronde-deadline.
  const sortedByDeadline = [...rounds].sort((a, b) => new Date(a.deadline) - new Date(b.deadline));
  const resolvedMatches = [];
  sortedByDeadline.forEach(round => {
    round.matches.forEach(match => {
      if (match.result) resolvedMatches.push({
        roundId: round.id,
        matchId: match.id
      });
    });
  });
  const last12 = resolvedMatches.slice(-12);
  const matchesUsed = last12.length;
  const formTotals = {};
  players.forEach(p => {
    formTotals[p] = 0;
  });
  last12.forEach(({
    roundId,
    matchId
  }) => {
    players.forEach(player => {
      const amount = perMatch[roundId]?.[matchId]?.[player]?.amount ?? -0.5;
      formTotals[player] += amount;
    });
  });
  let bestForm = [];
  let worstForm = [];
  if (matchesUsed > 0) {
    const formEntries = Object.entries(formTotals);
    const maxAmount = Math.max(...formEntries.map(([, a]) => a));
    const minAmount = Math.min(...formEntries.map(([, a]) => a));
    bestForm = formEntries.filter(([, a]) => a === maxAmount).map(([player, amount]) => ({
      player,
      amount
    }));
    worstForm = formEntries.filter(([, a]) => a === minAmount).map(([player, amount]) => ({
      player,
      amount
    }));
  }
  const correctEntries = Object.entries(correctCount).sort((a, b) => b[1] - a[1]);
  const topCorrectCount = correctEntries[0]?.[1] ?? 0;
  const mostCorrect = topCorrectCount > 0 ? correctEntries.filter(([, c]) => c === topCorrectCount).map(([player, count]) => ({
    player,
    count
  })) : [];
  const zeroEntries = Object.entries(zeroCount).sort((a, b) => b[1] - a[1]);
  const glazenwisser = zeroEntries.filter(([, c]) => c > 0).map(([player, count]) => ({
    player,
    count
  }));
  const sleepEntries = Object.entries(sleepCount).sort((a, b) => b[1] - a[1]);
  const topSleepCount = sleepEntries[0]?.[1] ?? 0;
  const slaperd = topSleepCount > 0 ? sleepEntries.filter(([, c]) => c === topSleepCount).map(([player, count]) => ({
    player,
    count
  })) : [];
  const DUTCH_MONTHS = ["januari", "februari", "maart", "april", "mei", "juni", "juli", "augustus", "september", "oktober", "november", "december"];
  const monthlyWinners = Object.keys(monthlyTotals).sort((a, b) => {
    const [ay, am] = a.split("-").map(Number);
    const [by, bm] = b.split("-").map(Number);
    return ay - by || am - bm;
  }).map(monthKey => {
    const [year, month] = monthKey.split("-").map(Number);
    const entries = Object.entries(monthlyTotals[monthKey]);
    const maxAmount = Math.max(...entries.map(([, a]) => a));
    const winners = entries.filter(([, a]) => a === maxAmount).map(([player]) => player);
    return {
      monthKey,
      label: `${DUTCH_MONTHS[month]} ${year}`,
      players: winners,
      amount: maxAmount
    };
  });
  return {
    bestEver,
    bestMonth,
    monthlyWinners,
    kingsRounds,
    mostCorrect,
    glazenwisser,
    slaperd,
    bestForm,
    worstForm,
    formMatchCount: matchesUsed
  };
}

// Telt, over alle afgesloten seizoenen heen, hoe vaak elke speler dat
// seizoen heeft gewonnen (bij een gedeelde hoogste stand winnen ze samen).
function computeSeasonWinCounts(seasons, rounds, predictions, players) {
  const counts = {};
  players.forEach(p => counts[p] = 0);
  seasons.forEach(season => {
    if (!season.closedAt) return; // alleen afgesloten seizoenen tellen als "gewonnen"
    const seasonRounds = rounds.filter(r => r.seasonId === season.id);
    if (seasonRounds.length === 0) return;
    const st = computeStandings(seasonRounds, predictions, players);
    const topTotal = Math.max(...players.map(p => st.totals[p] || 0));
    players.forEach(p => {
      if ((st.totals[p] || 0) === topTotal) counts[p] = (counts[p] || 0) + 1;
    });
  });
  return counts;
}

// Zoals computeSeasonWinCounts, maar geeft per afgesloten seizoen ook de
// naam van dat seizoen terug — zodat we kunnen tonen wélk seizoen iemand
// gewonnen heeft, niet alleen hoe vaak.
function computeSeasonWinYears(seasons, rounds, predictions, players) {
  const results = [];
  seasons.forEach(season => {
    if (!season.closedAt) return;
    const seasonRounds = rounds.filter(r => r.seasonId === season.id);
    if (seasonRounds.length === 0) return;
    const st = computeStandings(seasonRounds, predictions, players);
    const topTotal = Math.max(...players.map(p => st.totals[p] || 0));
    const winners = players.filter(p => (st.totals[p] || 0) === topTotal);
    if (winners.length > 0) results.push({
      season: season.name,
      winners
    });
  });
  return results;
}

// Combineert de handmatige Hall of Fame (vóór/naast deze app) met de
// seizoenen die de app zelf heeft bijgehouden, tot één chronologische lijst
// van { season, winners: [...] } — gebruikt in de prijzenkast en op Home.
function computeGlazenbolHistory(seasons, rounds, predictions, players) {
  const computed = computeSeasonWinYears(seasons, rounds, predictions, players);
  const manualSeasons = new Set(HALL_OF_FAME_GLAZENBOL.map(h => h.season));
  const manual = HALL_OF_FAME_GLAZENBOL.map(h => ({
    season: h.season,
    winners: h.winner ? [h.winner] : []
  }));
  const extra = computed.filter(c => !manualSeasons.has(c.season));
  return [...manual, ...extra].sort((a, b) => a.season.localeCompare(b.season));
}

// B100 Bokaal: als een wedstrijd na de 85e minuut nog van stand wisselt
// (georganiseerd aangevinkt bij de uitslag), wordt hier automatisch
// uitgerekend wie daardoor winst of verlies misloopt — het verschil tussen
// wat iemand had gekregen bij de stand op 85 min en wat de uiteindelijke
// uitslag oplevert. Alleen spelers bij wie dat verschil niet nul is
// (de "gedupeerde" of de "gelukkige") komen in de lijst.
function computeB100AutoStandings(rounds, predictions, players) {
  const totals = {};
  players.forEach(p => totals[p] = 0);
  const events = [];
  rounds.forEach(round => {
    round.matches.forEach(match => {
      if (!match.b100Active || !match.b100Stand85 || !match.result) return;
      if (match.b100Stand85 === match.result) return; // geen wijziging na 85+, geen effect
      players.forEach(player => {
        const pred = predictions?.[round.id]?.[player]?.[match.id];
        if (!pred || !pred.pick) return;
        const odds = parseOdds(match[oddsKey[pred.pick]]);
        const isJoker = round.jokerActive && round.jokerMatchId === match.id && pred.joker;
        const amountAt85 = pred.pick === match.b100Stand85 ? odds - 1 : -1;
        const amountFinal = pred.pick === match.result ? odds - 1 : -1;
        let delta = amountFinal - amountAt85;
        if (isJoker) delta *= 2;
        if (Math.abs(delta) < 0.005) return;
        totals[player] = (totals[player] || 0) + delta;
        events.push({
          id: `auto-${round.id}-${match.id}-${player}`,
          roundId: round.id,
          matchId: match.id,
          player,
          amount: delta,
          auto: true,
          createdAt: round.deadline || null
        });
      });
    });
  });
  return {
    totals,
    events
  };
}

// Per-speler statistieken voor de Stand-tab: aantal wedstrijden goed,
// succesratio (goed / aantal keer voorspeld) en aantal koningsrondes.
function computePlayerMatchStats(rounds, perMatch, players) {
  const stats = {};
  players.forEach(p => {
    stats[p] = {
      correct: 0,
      attempted: 0,
      kingsRounds: 0
    };
  });
  rounds.forEach(round => {
    const fullyResolved = round.matches.length > 0 && round.matches.every(m => m.result);
    round.matches.forEach(match => {
      if (!match.result) return;
      players.forEach(player => {
        const d = perMatch[round.id]?.[match.id]?.[player];
        if (d && d.pick) {
          stats[player].attempted += 1;
          if (d.correct) stats[player].correct += 1;
        }
      });
    });
    if (!fullyResolved) return;
    players.forEach(player => {
      const allCorrect = round.matches.every(m => {
        const d = perMatch[round.id]?.[m.id]?.[player];
        return d && d.pick && d.correct;
      });
      if (allCorrect) stats[player].kingsRounds += 1;
    });
  });
  return stats;
}

// FIREBASE_DB_URL wordt bovenaan index.html ingesteld (zie instructies.md).
// Gedeelde data (spelers, rondes, voorspellingen) -> Firebase Realtime Database,
// zodat iedereen die de site opent dezelfde data ziet.

// ---------- anonieme authenticatie ----------
// De databaseregels eisen tegenwoordig "auth != null" (zie instructies.md),
// dus elk verzoek moet een geldig Firebase-token meesturen. We loggen
// daarom onzichtbaar anoniem in — er is geen inlogscherm, spelers merken
// hier niets van. Het refresh-token wordt lokaal onthouden zodat hetzelfde
// anonieme account hergebruikt wordt in plaats van er bij elk bezoek een
// nieuw aan te maken.
let _authTokenCache = null; // { idToken, expiresAt }
async function ensureAuthToken() {
  if (_authTokenCache && _authTokenCache.expiresAt > Date.now() + 60000) {
    return _authTokenCache.idToken;
  }
  const apiKey = window.FIREBASE_API_KEY;
  const storedRefreshToken = loadLocal("firebaseRefreshToken", null);
  if (storedRefreshToken) {
    try {
      const res = await fetch(`https://securetoken.googleapis.com/v1/token?key=${apiKey}`, {
        method: "POST",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded"
        },
        body: `grant_type=refresh_token&refresh_token=${encodeURIComponent(storedRefreshToken)}`
      });
      if (res.ok) {
        const data = await res.json();
        _authTokenCache = {
          idToken: data.id_token,
          expiresAt: Date.now() + Number(data.expires_in || 3600) * 1000
        };
        saveLocal("firebaseRefreshToken", data.refresh_token);
        return _authTokenCache.idToken;
      }
    } catch (e) {
      console.error("Token vernieuwen mislukt, nieuw anoniem account aanmaken", e);
    }
  }
  // Geen (geldig) opgeslagen token: nieuw anoniem account aanmaken.
  const res = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${apiKey}`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      returnSecureToken: true
    })
  });
  const data = await res.json();
  if (!res.ok) {
    console.error("Anoniem inloggen bij Firebase mislukt", data);
    throw new Error("Kon niet anoniem inloggen bij Firebase.");
  }
  _authTokenCache = {
    idToken: data.idToken,
    expiresAt: Date.now() + Number(data.expiresIn || 3600) * 1000
  };
  saveLocal("firebaseRefreshToken", data.refreshToken);
  return _authTokenCache.idToken;
}

async function loadShared(key, fallback) {
  try {
    const token = await ensureAuthToken();
    const res = await fetch(`${window.FIREBASE_DB_URL}/${key}.json?auth=${token}`);
    if (!res.ok) return fallback;
    const data = await res.json();
    return data === null || data === undefined ? fallback : data;
  } catch (e) {
    console.error("Laden mislukt", key, e);
    return fallback;
  }
}
async function saveShared(key, value) {
  try {
    const token = await ensureAuthToken();

      headers: {
        "Content-Type": "application/json"

// boom te overschrijven. Cruciaal voor voorspellingen: als twee spelers

// van speler A wegvegen doordat B nog een verouderde lokale kopie had van
// de rest van de boom.
async function saveSharedPath(path, value) {
  try {
    const token = await ensureAuthToken();
    await fetch(`${window.FIREBASE_DB_URL}/${path}.json?auth=${token}`, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(value)
    });
  } catch (e) {
    console.error("Opslaan mislukt", path, e);
  }
}
// Persoonlijke data (welke naam dit apparaat/browser is ingelogd) -> gewoon
// localStorage, per device dus, precies zoals shared:false deed in Claude.
function loadLocal(key, fallback) {
  try {
    const raw = localStorage.getItem(`jgb:${key}`);
    return raw === null ? fallback : JSON.parse(raw);
  } catch (e) {
    return fallback;
  }
}
function saveLocal(key, value) {
  try {
    localStorage.setItem(`jgb:${key}`, JSON.stringify(value));
  } catch (e) {
    console.error("Opslaan mislukt", key, e);
  }
}
